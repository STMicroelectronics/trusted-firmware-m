description: |
  This document defines the binding for the remoteproc component that
  boots firmwares on the ST32MP2 family chipset.

compatible: "st,stm32mp2-a35"

include:
  - base.yaml
  - reset-device.yaml
  - access-device.yaml
  - nvmem-consumer.yaml

properties:
  resets:
    required: true

  clocks:
    description: The clocks to be restore after boot.

  interrupt-names:
    description: |
      - "ack" interrupt generated by a35 remote processor at bootime.

  regus:
    description: regulator phandles.
    type: phandles
