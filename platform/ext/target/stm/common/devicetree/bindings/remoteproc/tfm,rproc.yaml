description: |
  The remoteproc component boots co-processor via TF-M ioctl CPU interface.

compatible: "tfm,rproc"

include:
  - base.yaml

properties:
  tfm,cpu-id:
    type: int
    required: true
    description: |
      processor id controlled by TF-M ioctl CPU.

  interrupt-names:
    description: |
      - "wdog" interrupt generated by co-processor watchdog to report a crash.
