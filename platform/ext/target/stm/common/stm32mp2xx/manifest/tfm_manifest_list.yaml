# The "manifest" field must be relative path to this file or absolute path.
#
# Files per Secure Partition are generated to:
#   - "output_path", if it is a absolute path - not recommended
#   - generated_file_root/"output_path", if "output_path" is relative path
#   - generated_file_root/, if "output_path" is not specified
#       * generated_file_root is the path passed to tfm_parse_manifest_list.py
#         by -o/--outdir

{
  "description": "TF-M secure partition manifests",
  "type": "manifest_list",
  "version_major": 0,
  "version_minor": 1,
  "manifest_list": [
    {
      "description": "Non-Secure Mailbox Agent",
      "manifest": "./ns_agent_mailbox.yaml",
      "output_path": "secure_fw/partitions/ns_agent_mailbox",
      "conditional": "TFM_PARTITION_NS_AGENT_MAILBOX",
      "version_major": 0,
      "version_minor": 1,
      "pid": 262,
      "linker_pattern": {
        "library_list": [
           "*tfm_*ns_agent_mailbox.*"
         ],
      },
      "non_ffm_attributes": ['ns_agent']
    },
    {
      "description": "TFM SCP Firmware Partition",
      "manifest": "../secure_fw/partitions/scp/tfm_scp.yaml",
      "output_path": "secure_fw/partitions/scp",
      "conditional": "TFM_PARTITION_SCP",
      "version_major": 0,
      "version_minor": 1,
      "pid": 271,
      "linker_pattern": {
        "library_list": [
          "*tfm_*partition_scp*"
         ]
      }
    },
    {
      "description": "TFM IPCC Partition",
      "manifest": "../secure_fw/partitions/ipcc/tfm_ipcc.yaml",
      "output_path": "secure_fw/partitions/ipcc",
      "conditional": "TFM_PARTITION_IPCC",
      "version_major": 0,
      "version_minor": 1,
      "pid": 272,
      "linker_pattern": {
        "library_list": [
          "*tfm_*partition_ipcc*"
         ]
      }
    },
    {
      "description": "TFM PM Partition",
      "manifest": "../secure_fw/partitions/pm/tfm_pm.yaml",
      "output_path": "secure_fw/partitions/pm",
      "conditional": "TFM_PARTITION_PM",
      "version_major": 0,
      "version_minor": 1,
      "pid": 273,
      "linker_pattern": {
        "library_list": [
          "*tfm_*partition_pm*"
         ]
      }
    },
    {
      "description": "TFM ADAC Service Partition",
      "manifest": "../secure_fw/partitions/adac/tfm_adac.yaml",
      "output_path": "secure_fw/partitions/adac",
      "conditional": "TFM_PARTITION_ADAC",
      "version_major": 0,
      "version_minor": 1,
